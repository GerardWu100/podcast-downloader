services:
  podcast-downloader:
    build: .
    container_name: podcast-downloader
    ports:
      - "127.0.0.1:50022:8000"
    restart: unless-stopped
    environment:
      - TZ=America/Toronto
      - PODCAST_DATA_DIR=/data
      - PODCAST_DOWNLOAD_DIR=/downloads
      - PODCAST_INTERMEDIATE_DIR=/temporary
      - DOWNLOAD_INTERVAL_HOURS=48
      - YT_DLP_AUTO_UPDATE=true
    volumes:
      # Left of each colon is the folder on your machine, set in .env and
      # falling back to the default shown. Right of the colon is the path
      # inside the container, which the environment block above names and
      # which must not change.
      - ${PODCAST_DATA_HOST_DIR:-${HOME}/.containers/podcast-downloader}:/data
      - ${PODCAST_DOWNLOADS_HOST_DIR:-${HOME}/downloads/podcasts}:/downloads
      - ${PODCAST_TEMP_HOST_DIR:-${HOME}/downloads/temporary}:/temporary
    networks:
      - single

networks:
  single:
    external: true
