[project]
name = "podcast-downloader"
version = "0.1.0"
description = "Self-hostable podcast downloader for Audiobookshelf with yt-dlp and SponsorBlock ad trimming"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.129.0",
    "python-multipart>=0.0.20",
    "uvicorn>=0.34.0",
]

[dependency-groups]
dev = [
    "matplotlib>=3.11.0",
    "pytest>=9.0.2",
    "ruff==0.15.12",
]

[tool.pytest.ini_options]
pythonpath = ["."]
