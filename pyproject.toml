[project]
name = "podcast-downloader"
version = "0.1.0"
description = "Download web video audio as MP3 with YouTube SponsorBlock trimming"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.129.0",
    "python-multipart>=0.0.20",
    "ruff>=0.15.12",
    "uvicorn>=0.34.0",
    "yt-dlp>=2026.2.4",
]

[dependency-groups]
dev = [
    "pytest>=9.0.2",
]

[tool.pytest.ini_options]
pythonpath = ["."]
