# Run the published image without cloning the repository. This file is all
# the server needs; save it as docker-compose.yml in an empty folder.
#
# Start:   docker compose up -d
# Update:  docker compose pull && docker compose up -d
#
# There is no login by default. To require one, set UI_USERNAME and
# UI_PASSWORD in ~/.containers/podcast-downloader/.env (created on first
# start), then run `docker compose restart`.
#
# `docker-compose.yml` in the repository is the same service built from a
# local checkout instead of pulled.
services:
  podcast-downloader:
    # `latest` follows master. To pin or roll back, use a `sha-<commit>` tag
    # from the repository's Packages page.
    image: ghcr.io/gerardwu100/podcast-downloader:latest
    container_name: podcast-downloader
    ports:
      # Open to every device that can reach the server, over plain HTTP.
      # Fine on a home network; put HTTPS and a login in front before
      # exposing it to the internet, or use "127.0.0.1:6847:8000" to keep it
      # to the server itself.
      - "6847:8000"
    restart: unless-stopped
    environment:
      # The run schedule uses this clock: config.ini sets the hour and the
      # number of days between runs.
      - TZ=America/Toronto
      - PODCAST_DATA_DIR=/data
      - PODCAST_DOWNLOAD_DIR=/downloads
      - PODCAST_INTERMEDIATE_DIR=/temporary
      - YT_DLP_AUTO_UPDATE=true
      # The entrypoint repairs mounted-file ownership, then runs the app with
      # this host user and group. Change both if `id -u` and `id -g` on the
      # server do not print 1000.
      - HOST_UID=1000
      - HOST_GID=1000
    volumes:
      # Folder on your machine, then the path inside the container. Edit the
      # left side to keep files somewhere else; the right sides pair with the
      # three directory settings above and must stay as they are.
      - $HOME/.containers/podcast-downloader:/data
      - $HOME/downloads/podcasts/:/downloads
      - $HOME/downloads/temporary:/temporary
    networks:
      - single

networks:
  # Shared network where a reverse proxy and Apprise can reach this container.
  # Compose joins it if it exists and creates it if it does not.
  single:
    name: single
