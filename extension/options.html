<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Podcast Downloader settings</title>
    <link rel="stylesheet" href="options.css" />
  </head>
  <body>
    <main>
      <h1>Podcast Downloader</h1>

      <label for="server-url">Server address</label>
      <input id="server-url" type="text" placeholder="https://podcast.example.com" spellcheck="false" />

      <label for="api-token">API token</label>
      <input id="api-token" type="password" spellcheck="false" />

      <label class="checkbox">
        <input id="download-immediately" type="checkbox" />
        Download immediately
      </label>

      <div class="buttons">
        <button id="save" type="button">Save</button>
        <button id="test" type="button">Test connection</button>
      </div>

      <p id="status" role="status"></p>
    </main>
    <script type="module" src="options.js"></script>
  </body>
</html>
