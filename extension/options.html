<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Podcast Downloader settings</title>
    <link rel="stylesheet" href="options.css" />
  </head>
  <body>
    <main>
      <h1>Podcast Downloader</h1>

      <label for="server-url">Server address</label>
      <input id="server-url" type="text" placeholder="https://podcast.example.com" spellcheck="false" />

      <label for="username">Username</label>
      <input id="username" type="text" autocomplete="username" spellcheck="false" />

      <label for="password">Password</label>
      <input id="password" type="password" autocomplete="current-password" />

      <div class="buttons">
        <button id="save" type="button">Save</button>
        <button id="test" type="button">Test connection</button>
      </div>

      <p id="status" role="status"></p>
    </main>
    <script type="module" src="options.js"></script>
  </body>
</html>
