[podcast]
# Path to the URLs list (relative to this folder unless absolute)
urls_file = urls.txt

# Output directory for finished MP3s (relative to this folder unless absolute)
output_dir = downloads

# Scratch directory for yt-dlp and metadata passes before files are published.
# In Docker, PODCAST_INTERMEDIATE_DIR overrides this.
intermediate_dir = download_work

# Number of latest videos to pull from channel URLs. Must be at least 1.
channel_count = 2

# Minimum age (hours) for YouTube videos to allow SponsorBlock time. Must be at least 0.
min_channel_video_age_hours = 24

# Delay (seconds) between downloads to avoid YouTube rate limiting
# Must be at least 0.
# Recommended: 2-5 seconds for VPS/automated runs
delay_seconds = 60

# Number of days to keep downloaded MP3s based on embedded download-date metadata.
# Must be at least 1.
retention_days = 30

# Time limit (seconds) for one yt-dlp attempt, covering the download plus the
# MP3 conversion, SponsorBlock pass, and thumbnail embed. Must be at least 60.
# A one to three hour podcast on a throttled connection can need well over ten
# minutes, so raise this rather than lower it if long episodes time out.
download_timeout_seconds = 3600

# Log and state files (relative to this folder unless absolute)
log_file = download.log
downloaded_urls_file = downloaded_urls.txt
bypass_age_check_file = bypass_age_check_urls.txt

# Netscape/Mozilla-format cookie file for YouTube downloads.
# First line must be exactly: # HTTP Cookie File  OR  # Netscape HTTP Cookie File
# Line endings must match the OS: LF (\n) on Linux/macOS, CRLF (\r\n) on Windows.
# HTTP 400 Bad Request from yt-dlp --cookies often means wrong newline format.
# If not set, cookies.txt in this same folder is used automatically when it exists.
# In Docker, put cookies.txt in the mounted PODCAST_DATA_DIR directory.
cookies_file = cookies.txt

# YouTube cookie strategy when a cookie file is configured (yes/no, true/false).
# true: pass cookies on the first YouTube yt-dlp call; retry once without cookies on failure.
# false: try without cookies first; retry once with the cookie file on failure.
always_use_cookies = true

# Trust proxy-forwarded client IPs (X-Forwarded-For, CF-Connecting-IP).
# Must be true when behind Cloudflare Tunnel or another reverse proxy you control.
# Leave false for direct exposure; clients could otherwise spoof their IP and bypass bans.
trust_x_forwarded_for = true
